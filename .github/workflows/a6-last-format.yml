name: A6 Last Formatter

on:
  push:
    branches:
      - tmp/a6-last-format-20261005

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[formatted]') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
      - run: flutter pub get --enforce-lockfile
      - run: dart format lib/app/shell/session_expired_overlay.dart lib/features/settings/presentation/language_screen.dart
      - name: Commit formatter output
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile/lib/app/shell/session_expired_overlay.dart apps/mobile/lib/features/settings/presentation/language_screen.dart
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "style(mobile): format remaining A6 files [formatted]"
          git push
