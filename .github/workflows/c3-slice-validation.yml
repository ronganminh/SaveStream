name: C3 Slice Validation

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
      - run: flutter pub get --enforce-lockfile
      - name: Format C3 Dart
        run: >-
          dart format
          lib/app/bootstrap.dart
          lib/features/local_recordings/data/repositories/api_local_recording_repository.dart
          lib/platform/android_local_recording_channels.dart
          lib/platform/android_local_recorder.dart
          lib/platform/android_local_recovery_service.dart
          lib/platform/android_recording_platform_service.dart
          test/v2c_c3_local_recording_api_test.dart
      - name: Analyze
        run: flutter analyze --fatal-infos
      - name: Test C3 API
        run: flutter test test/v2c_c3_local_recording_api_test.dart
      - name: Print formatted files
        if: always()
        run: |
          for file in             lib/app/bootstrap.dart             lib/features/local_recordings/data/repositories/api_local_recording_repository.dart             lib/platform/android_local_recording_channels.dart             lib/platform/android_local_recorder.dart             lib/platform/android_local_recovery_service.dart             lib/platform/android_recording_platform_service.dart             test/v2c_c3_local_recording_api_test.dart; do
            echo "--- BEGIN $file ---"
            cat "$file"
            echo "--- END $file ---"
          done
