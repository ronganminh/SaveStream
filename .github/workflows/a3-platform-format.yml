name: A3 Platform Format

on:
  push:
    branches:
      - tmp/a3-format-platform-20261004

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[formatted]') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Format A3 platform files
        run: |
          dart format \
            lib/platform/contracts/recording_platform_service.dart \
            lib/platform/fakes/fake_recording_platform_service.dart \
            lib/platform/platform_providers.dart \
            lib/features/local_recordings/presentation/controllers/recording_platform_controller.dart \
            lib/features/local_recordings/presentation/recording_platform_bridge.dart \
            lib/features/local_recordings/presentation/local_recording_screen.dart \
            lib/features/settings/presentation/android_recording_background_screen.dart \
            lib/features/settings/presentation/android_oem_recording_guidance_screen.dart \
            lib/features/settings/presentation/ios_recording_guidance_screen.dart \
            lib/features/settings/presentation/settings_screen.dart \
            lib/app/router/app_routes.dart \
            lib/app/router/app_router.dart \
            lib/app/shell/main_shell.dart \
            test/v2a_a3_platform_guidance_test.dart
      - name: Commit formatter output
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style(mobile): apply Dart 3.47.0 platform formatter [formatted]"
          git push
