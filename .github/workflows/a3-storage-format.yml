name: A3 Storage Format

on:
  push:
    branches:
      - tmp/a3-format-storage-20261004

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[formatted]') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Format A3 storage files
        run: |
          dart format \
            lib/platform/contracts/local_recorder.dart \
            lib/platform/fakes/fake_local_recorder.dart \
            lib/features/local_recordings/presentation/local_recording_screen.dart \
            lib/core/widgets/ss_v2_components.dart \
            test/v2a_a3_storage_finalizing_test.dart
      - name: Commit formatter output
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style(mobile): apply Dart 3.47.0 storage formatter [formatted]"
          git push
