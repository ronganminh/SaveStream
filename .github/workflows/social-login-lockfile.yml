name: Prepare social login lockfile (temporary)

on:
  push:
    branches:
      - feat/google-apple-login
    paths:
      - .github/workflows/social-login-lockfile.yml
      - apps/mobile/pubspec.yaml

permissions:
  contents: write

jobs:
  lockfile:
    if: github.repository == 'ronganminh/SaveStream'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - name: Regenerate lockfile with new Firebase Auth dependencies
        working-directory: apps/mobile
        run: flutter pub get
      - name: Apply official Dart formatter to changed authentication sources
        run: |
          dart format apps/mobile/lib/features/auth \
            apps/mobile/lib/core/widgets/ss_fields.dart \
            apps/mobile/test/social_auth_controller_test.dart
      - name: Commit the resolved lockfile and formatting to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile/pubspec.lock apps/mobile/lib/features/auth apps/mobile/lib/core/widgets/ss_fields.dart apps/mobile/test/social_auth_controller_test.dart
          if ! git diff --cached --quiet; then
            git commit -m "chore(mobile): lock Firebase Auth and Google Sign-In versions"
            git push origin HEAD:feat/google-apple-login
          fi
