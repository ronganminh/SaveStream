name: Backend CI
on:
  push:
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]
jobs:
  phase-0:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install locked dependencies
        run: python -m pip install --no-deps -r requirements.lock
      - name: Install backend package
        run: python -m pip install --no-deps --no-build-isolation -e .
      - name: Lint
        run: ruff check src tests
      - name: Type check Phase 0 boundaries
        run: mypy src/config.py src/engine src/adapters src/http_utils/http_client.py src/utils/logger_manager.py src/utils/dependencies.py
      - name: Test
        run: pytest
      - name: CLI smoke test
        run: python src/main.py -h
