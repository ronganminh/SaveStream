name: Backend CI
on:
  push:
    paths: ["backend/**", "docs/openapi.yaml", ".github/workflows/backend-ci.yml"]
  pull_request:
    paths: ["backend/**", "docs/openapi.yaml", ".github/workflows/backend-ci.yml"]
jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install locked dependencies
        run: python -m pip install --no-deps -r requirements.lock
      - name: Install backend package
        run: python -m pip install --no-deps --no-build-isolation -e .
      - name: Lint
        run: ruff check src tests
      - name: Type check backend boundaries
        run: mypy src/config.py src/engine src/adapters src/app src/http_utils/http_client.py src/utils/logger_manager.py src/utils/dependencies.py
      - name: Test
        run: pytest
      - name: Alembic migration smoke
        env:
          SAVESTREAM_ENVIRONMENT: test
          SAVESTREAM_DATABASE_URL: sqlite+aiosqlite:///./ci-phase2.db
        run: |
          rm -f ci-phase2.db
          alembic upgrade head
          alembic downgrade base
      - name: CLI smoke test
        run: python src/main.py -h
      - name: Docker Compose config
        run: docker compose -f docker-compose.yml config --quiet
