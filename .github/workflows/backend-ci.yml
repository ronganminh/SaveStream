name: Backend CI
on:
  push:
    paths: ["backend/**", "deploy/**", "docs/openapi.yaml", "docs/operations/**", "docker-compose.production.example.yml", ".github/workflows/backend-ci.yml"]
  pull_request:
    paths: ["backend/**", "deploy/**", "docs/openapi.yaml", "docs/operations/**", "docker-compose.production.example.yml", ".github/workflows/backend-ci.yml"]
jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install locked dependencies
        run: python -m pip install --no-deps -r requirements.lock
      - name: Install backend package
        run: python -m pip install --no-deps --no-build-isolation -e .
      - name: Lint
        run: ruff check src tests
      - name: Type check backend boundaries
        run: mypy src/config.py src/engine src/adapters src/app src/http_utils/http_client.py src/utils/logger_manager.py src/utils/dependencies.py
      - name: Test
        run: pytest
      - name: Alembic migration smoke
        env:
          SAVESTREAM_ENVIRONMENT: test
          SAVESTREAM_DATABASE_URL: sqlite+aiosqlite:///./ci-phase2.db
        run: |
          rm -f ci-phase2.db
          alembic upgrade head
          alembic downgrade base
      - name: CLI smoke test
        run: python src/main.py -h
      - name: Production config smoke
        env:
          SAVESTREAM_ENVIRONMENT: production
          SAVESTREAM_DATABASE_URL: postgresql+asyncpg://user:password@db:5432/savestream
          SAVESTREAM_REDIS_URL: redis://redis:6379/0
          SAVESTREAM_JWT_SECRET: ci-production-jwt-secret-at-least-thirty-two-characters
          SAVESTREAM_FRONTEND_BASE_URL: https://app.example.test
          SAVESTREAM_CORS_ALLOW_ORIGINS: https://app.example.test
          SAVESTREAM_SMTP_HOST: smtp-relay.brevo.com
          SAVESTREAM_SMTP_PORT: 587
          SAVESTREAM_SMTP_USERNAME: ci-smtp-login
          SAVESTREAM_SMTP_PASSWORD: ci-smtp-key
          SAVESTREAM_SMTP_STARTTLS: "true"
          SAVESTREAM_EMAIL_FROM: SaveStream <no-reply@example.test>
          SAVESTREAM_PAYMENT_PROVIDER: gateway
          SAVESTREAM_PAYMENT_PROVIDER_BASE_URL: https://payments.example.test
          SAVESTREAM_PAYMENT_PROVIDER_API_KEY: ci-provider-key
          SAVESTREAM_PAYMENT_WEBHOOK_SECRET: ci-provider-webhook-secret
          SAVESTREAM_METRICS_TOKEN: ci-metrics-secret
          SAVESTREAM_TRUSTED_PROXY_CIDRS: 10.0.0.0/8
          SAVESTREAM_FORCE_HTTPS: "true"
          SAVESTREAM_API_RATE_LIMIT: 300
          SAVESTREAM_QUOTA_MAX_WATCHES_PER_USER: 100
          SAVESTREAM_QUOTA_MAX_RECORDINGS_PER_DAY: 100
          SAVESTREAM_QUOTA_MAX_ACTIVE_RECORDINGS_PER_USER: 2
        run: python -c "from app.settings import AppSettings; AppSettings.from_env()"
      - name: Release readiness config smoke
        env:
          SAVESTREAM_ENVIRONMENT: production
          SAVESTREAM_LOG_FORMAT: json
          SAVESTREAM_DATABASE_URL: postgresql+asyncpg://user:password@db:5432/savestream
          SAVESTREAM_REDIS_URL: redis://redis:6379/0
          SAVESTREAM_MINIO_ENDPOINT: https://account.r2.cloudflarestorage.com
          SAVESTREAM_MINIO_ACCESS_KEY: ci-r2-access
          SAVESTREAM_MINIO_SECRET_KEY: ci-r2-secret
          SAVESTREAM_MINIO_BUCKET: savestream-recordings
          SAVESTREAM_MINIO_SECURE: "true"
          SAVESTREAM_JWT_SECRET: ci-production-jwt-secret-at-least-thirty-two-characters
          SAVESTREAM_FRONTEND_BASE_URL: https://app.example.test
          SAVESTREAM_CORS_ALLOW_ORIGINS: https://app.example.test
          SAVESTREAM_SMTP_HOST: smtp-relay.brevo.com
          SAVESTREAM_SMTP_PORT: 587
          SAVESTREAM_SMTP_USERNAME: ci-smtp-login
          SAVESTREAM_SMTP_PASSWORD: ci-smtp-key
          SAVESTREAM_SMTP_STARTTLS: "true"
          SAVESTREAM_EMAIL_FROM: SaveStream <no-reply@example.test>
          SAVESTREAM_PAYMENT_PROVIDER: lemonsqueezy
          SAVESTREAM_PAYMENT_PROVIDER_BASE_URL: https://api.lemonsqueezy.com/v1
          SAVESTREAM_PAYMENT_PROVIDER_API_KEY: ci-live-provider-key
          SAVESTREAM_PAYMENT_WEBHOOK_SECRET: ci-live-webhook-secret
          SAVESTREAM_LEMON_SQUEEZY_STORE_ID: "123"
          SAVESTREAM_LEMON_SQUEEZY_VARIANT_ID: "456"
          SAVESTREAM_METRICS_TOKEN: ci-metrics-secret
          SAVESTREAM_OPS_ALERT_EMAIL: ops@example.test
          SAVESTREAM_TRUSTED_PROXY_CIDRS: 10.0.0.0/8
          SAVESTREAM_FORCE_HTTPS: "true"
          SAVESTREAM_SECURITY_HEADERS_ENABLED: "true"
          SAVESTREAM_API_RATE_LIMIT: 300
          SAVESTREAM_QUOTA_MAX_WATCHES_PER_USER: 100
          SAVESTREAM_QUOTA_MAX_RECORDINGS_PER_DAY: 100
          SAVESTREAM_QUOTA_MAX_ACTIVE_RECORDINGS_PER_USER: 2
          SAVESTREAM_RECORDING_SOURCE_BACKEND: tiktok
        run: |
          python -m app.release.readiness             --api-origin https://api.example.test             --frontend-origin https://app.example.test             --payment-webhook-url https://api.example.test/v1/webhooks/payments/lemonsqueezy
          SAVESTREAM_PAYMENT_PROVIDER=disabled python -m app.release.readiness \
            --api-origin https://api.example.test \
            --frontend-origin https://app.example.test \
            --payment-webhook-url https://api.example.test/v1/webhooks/payments/lemonsqueezy \
            --allow-disabled-payments
      - name: Operational script syntax
        run: |
          sh -n scripts/backup.sh
          sh -n scripts/restore.sh
          sh -n scripts/backup_restore_drill.sh
          sh -n ../deploy/vps/init-production-secrets.sh
          python -m py_compile scripts/canary_check.py scripts/load_probe.py scripts/release_smoke.py
      - name: Package dependency consistency
        run: python -m pip check
      - name: Docker Compose config
        run: |
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml config --quiet
      - name: Production Docker Compose config
        env:
          SAVESTREAM_SECRETS_DIR: /tmp/savestream-production-secrets
          SAVESTREAM_R2_ENDPOINT: https://account.r2.cloudflarestorage.com
          SAVESTREAM_R2_BUCKET: savestream-recordings
          SAVESTREAM_LEMON_SQUEEZY_STORE_ID: "123"
          SAVESTREAM_LEMON_SQUEEZY_VARIANT_ID: "456"
          SAVESTREAM_OPS_ALERT_EMAIL: ops@example.test
          SAVESTREAM_TRUSTED_PROXY_CIDRS: 10.0.0.0/8
        run: |
          cd ..
          docker compose -f deploy/vps/docker-compose.production.yml config --quiet
          SAVESTREAM_PAYMENT_PROVIDER=disabled SAVESTREAM_LEMON_SQUEEZY_STORE_ID= SAVESTREAM_LEMON_SQUEEZY_VARIANT_ID= \
            docker compose -f deploy/vps/docker-compose.production.yml config --quiet
