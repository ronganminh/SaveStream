name: Mobile CI

on:
  push:
    branches:
      - main
      - feat/flutter-mobile
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/mobile-ci.yml'
  pull_request:
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/mobile-ci.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  flutter-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Generate official brand raster
        run: |
          python3 -m venv .brand-venv
          .brand-venv/bin/python -m pip install --disable-pip-version-check cairosvg==2.7.1
          .brand-venv/bin/python tool/generate_brand_assets.py

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Generate native splash
        run: dart run flutter_native_splash:create

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Format and commit A0 sources
        run: |
          dart format lib/app lib/core lib/features lib/l10n/l10n.dart test
          if ! git diff --quiet -- lib/app lib/core lib/features lib/l10n/l10n.dart test; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add lib/app lib/core lib/features lib/l10n/l10n.dart test
            git commit -m "style(mobile): format A0 sources"
            git push origin HEAD:${{ github.head_ref || github.ref_name }}
          fi

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test

      - name: Build production Android App Bundle
        run: >-
          flutter build appbundle --release
          --dart-define=APP_ENV=production
          --dart-define=MOBILE_EXTERNAL_CHECKOUT_ENABLED=false

      - name: Phase 17 release audit
        run: bash tool/phase17_release_audit.sh


  ios-release-compile:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Generate official brand raster
        run: |
          python3 -m venv .brand-venv
          .brand-venv/bin/python -m pip install --disable-pip-version-check cairosvg==2.7.1
          .brand-venv/bin/python tool/generate_brand_assets.py

      - name: Generate native assets
        run: |
          dart run flutter_launcher_icons
          dart run flutter_native_splash:create
          flutter gen-l10n

      # Flutter rejects --release for simulator builds, and an unsigned device
      # build needs a Development Team. This compiles the production
      # configuration and native plugins; it does not validate a store archive.
      - name: Compile production-config iOS app for simulator
        run: >-
          flutter build ios --simulator --debug
          --dart-define=APP_ENV=production
          --dart-define=MOBILE_EXTERNAL_CHECKOUT_ENABLED=false
