name: Mobile CI

on:
  push:
    branches:
      - feat/flutter-mobile
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/mobile-ci.yml'
  pull_request:
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/mobile-ci.yml'

permissions:
  contents: read

jobs:
  flutter-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Show canonical connectivity E2E format
        run: dart format --output=show test/backend_connectivity_e2e_test.dart

      - name: Check formatting
        run: >-
          dart format --output=none --set-exit-if-changed
          lib/app lib/core lib/features lib/l10n/l10n.dart test

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test
