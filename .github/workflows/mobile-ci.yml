name: Mobile CI

on:
  push:
    branches:
      - feat/flutter-mobile
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/mobile-ci.yml'
  pull_request:
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/mobile-ci.yml'

permissions:
  contents: read

jobs:
  flutter-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Show home controller formatter diff
        run: |
          dart format lib/features/home/presentation/controllers/home_dashboard_controller.dart
          git diff -- lib/features/home/presentation/controllers/home_dashboard_controller.dart
          exit 1

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test
