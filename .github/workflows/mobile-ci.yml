name: Mobile CI

on:
  push:
    branches:
      - feat/flutter-mobile
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/mobile-ci.yml'
  pull_request:
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/mobile-ci.yml'

permissions:
  contents: read

jobs:
  flutter-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Show Phase 12 formatting
        run: >-
          dart format --output=show
          lib/core/api/api_client.dart
          lib/features/channels/presentation/channel_detail_screen.dart
          lib/features/channels/presentation/controllers/watch_providers.dart
          lib/features/recordings/data/remote/recording_api_models.dart
          lib/features/recordings/data/remote/recording_event_source.dart
          lib/features/recordings/data/repositories/api_recording_repository.dart
          lib/features/recordings/data/repositories/mock_recording_repository.dart
          lib/features/recordings/domain/models/recording_summary.dart
          lib/features/recordings/presentation/controllers/recording_providers.dart
          lib/features/recordings/presentation/recording_detail_screen.dart
          test/recording_phase12_test.dart

      - name: Check formatting
        run: >-
          dart format --output=none --set-exit-if-changed
          lib/app lib/core lib/features lib/l10n/l10n.dart test

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test
