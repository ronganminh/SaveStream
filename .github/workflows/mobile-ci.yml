name: Mobile CI

on:
  push:
    branches:
      - main
      - feat/flutter-mobile
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/mobile-ci.yml'
  pull_request:
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/mobile-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flutter-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Generate official brand raster
        run: |
          python3 -m venv .brand-venv
          .brand-venv/bin/python -m pip install --disable-pip-version-check cairosvg==2.7.1
          .brand-venv/bin/python tool/generate_brand_assets.py

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Generate native splash
        run: dart run flutter_native_splash:create

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Check formatting
        run: >-
          dart format --output=none --set-exit-if-changed
          lib/app lib/core lib/features lib/l10n/l10n.dart test

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test

      - name: Build production Android App Bundle
        run: >-
          flutter build appbundle --release
          --dart-define=APP_ENV=production
          --dart-define=MOBILE_EXTERNAL_CHECKOUT_ENABLED=false

      - name: Report Android App Bundle size
        run: ls -lh build/app/outputs/bundle/release/app-release.aab

      - name: Mobile release audit
        run: bash tool/release_audit.sh


  ios-release-compile:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Generate official brand raster
        run: |
          python3 -m venv .brand-venv
          .brand-venv/bin/python -m pip install --disable-pip-version-check cairosvg==2.7.1
          .brand-venv/bin/python tool/generate_brand_assets.py

      - name: Generate native assets
        run: |
          dart run flutter_launcher_icons
          dart run flutter_native_splash:create
          flutter gen-l10n

      # Flutter rejects --release for simulator builds, and an unsigned device
      # build needs a Development Team. This compiles the production
      # configuration and native plugins; it does not validate a store archive.
      - name: Compile production-config iOS app for simulator
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if flutter build ios --simulator --debug \
              --dart-define=APP_ENV=production \
              --dart-define=MOBILE_EXTERNAL_CHECKOUT_ENABLED=false; then
              exit 0
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "iOS simulator build failed after $attempt attempts."
              exit 1
            fi

            echo "::warning::iOS simulator build attempt $attempt failed; retrying transient SPM/CDN resolution."
            sleep $((attempt * 10))
          done

  android-emulator-smoke:
    needs: flutter-checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Generate native assets
        run: bash tool/generate_native_assets.sh

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch SaveStream on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          working-directory: apps/mobile
          script: bash tool/android_emulator_smoke.sh
