name: Mobile CI

on:
  push:
    branches:
      - feat/flutter-mobile
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/mobile-ci.yml'
  pull_request:
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/mobile-ci.yml'

permissions:
  contents: read

jobs:
  flutter-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Show Phase 14 formatting
        run: >-
          dart format --output=show
          lib/core/widgets/ss_async_states.dart
          lib/core/widgets/ss_states.dart
          lib/features/billing/presentation/billing_return_screen.dart
          lib/features/billing/presentation/billing_screen.dart
          lib/features/channels/presentation/add_channel_screen.dart
          lib/features/channels/presentation/channel_detail_screen.dart
          lib/features/channels/presentation/channels_screen.dart
          lib/features/credits/presentation/credits_screen.dart
          lib/features/home/presentation/home_screen.dart
          lib/features/recordings/presentation/controllers/recording_providers.dart
          lib/features/recordings/presentation/recording_detail_screen.dart
          lib/features/recordings/presentation/recordings_screen.dart
          lib/features/settings/presentation/profile_screen.dart

      - name: Check formatting
        run: >-
          dart format --output=none --set-exit-if-changed
          lib/app lib/core lib/features lib/l10n/l10n.dart test

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test
