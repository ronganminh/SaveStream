name: C3 Format Validation

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
      - run: flutter pub get --enforce-lockfile
      - name: Format C3 Dart
        run: >-
          dart format
          lib/features/local_recordings/data/repositories/api_local_recording_repository.dart
          test/v2c_c3_local_recording_api_test.dart
      - name: Analyze
        run: flutter analyze --fatal-infos
      - name: Test C3 API
        run: flutter test test/v2c_c3_local_recording_api_test.dart
      - name: Print formatted files
        if: always()
        run: |
          echo '--- BEGIN C3 REPO ---'
          cat lib/features/local_recordings/data/repositories/api_local_recording_repository.dart
          echo '--- END C3 REPO ---'
          echo '--- BEGIN C3 TEST ---'
          cat test/v2c_c3_local_recording_api_test.dart
          echo '--- END C3 TEST ---'
