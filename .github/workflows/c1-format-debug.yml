name: C1 Format Debug

on:
  push:
    branches:
      - tmp/c1-format-20261004

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
      - name: Run formatter and print exact files
        run: |
          dart format lib/app/bootstrap.dart test/v2c_c1_api_repositories_test.dart
          echo '--- BEGIN bootstrap.dart ---'
          cat lib/app/bootstrap.dart
          echo '--- END bootstrap.dart ---'
          echo '--- BEGIN v2c_c1_api_repositories_test.dart ---'
          cat test/v2c_c1_api_repositories_test.dart
          echo '--- END v2c_c1_api_repositories_test.dart ---'
