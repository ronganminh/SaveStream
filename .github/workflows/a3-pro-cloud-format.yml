name: A3 Pro Cloud Format

on:
  push:
    branches:
      - tmp/a3-format-pro-cloud-20261004

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[formatted]') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Format A3 Pro Local Cloud files
        run: |
          dart format \
            lib/features/channels/presentation/pro_manual_record_sheet.dart \
            lib/features/channels/presentation/channel_detail_screen.dart \
            lib/features/local_recordings/presentation/local_recording_screen.dart \
            lib/features/recordings/presentation/recording_detail_screen.dart \
            test/v2a_a3_pro_manual_cloud_test.dart
      - name: Commit formatter output
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style(mobile): apply Dart 3.47.0 Pro Cloud formatter [formatted]"
          git push
