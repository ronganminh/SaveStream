name: Web CI

on:
  pull_request:
    paths:
      - "apps/web/**"
      - "package.json"
      - ".github/workflows/web-ci.yml"
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "package.json"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm --workspace apps/web run format
      - run: npm --workspace apps/web run lint
      - run: npm run typecheck
      - run: npm --workspace apps/web run test:p0
      - run: npm --workspace apps/web run test:p2
      - run: npm --workspace apps/web run test:p3
      - run: npm --workspace apps/web run test:auth
      - run: npm --workspace apps/web run test:repositories
      - run: npm --workspace apps/web run test:watches
      - run: npm --workspace apps/web run test:recordings
      - run: npm --workspace apps/web run test:artifacts
      - run: npm --workspace apps/web run test:credits
      - run: npm --workspace apps/web run test:billing
      - run: npm --workspace apps/web run test:account
      - run: npm --workspace apps/web run test:notifications
      - run: npm --workspace apps/web run test:admin
      - run: npm --workspace apps/web run test:cleanup
      - run: npm run build
      - name: Build production mode
        env:
          VITE_APP_MODE: production
          VITE_API_BASE_URL: https://api-staging.savestream.online
        run: npm run build
