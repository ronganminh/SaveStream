name: A4 Final Format

on:
  push:
    branches:
      - tmp/a4-final-format-20261004

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[formatted]') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
      - run: flutter pub get --enforce-lockfile
      - run: dart format lib/app/router/app_router.dart lib/app/router/app_routes.dart lib/features/recordings/presentation/local_recording_detail_screen.dart lib/features/recordings/presentation/recording_detail_screen.dart lib/features/recordings/presentation/recordings_screen.dart
      - name: Commit formatter output
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile/lib/app/router/app_router.dart apps/mobile/lib/app/router/app_routes.dart apps/mobile/lib/features/recordings/presentation/local_recording_detail_screen.dart apps/mobile/lib/features/recordings/presentation/recording_detail_screen.dart apps/mobile/lib/features/recordings/presentation/recordings_screen.dart
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "style(mobile): format A4 final slice [formatted]"
          git push
