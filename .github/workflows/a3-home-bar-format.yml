name: A3 Home Bar Format

on:
  push:
    branches:
      - tmp/a3-format-home-bar-20261004

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[formatted]') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Format A3 Home and recording bar files
        run: |
          dart format \
            lib/app/shell/main_shell.dart \
            lib/features/recordings/presentation/active_recording_bar.dart \
            lib/features/home/presentation/home_recording_widgets.dart \
            lib/features/home/presentation/home_screen.dart \
            test/v2a_a3_home_recording_variants_test.dart
      - name: Commit formatter output
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style(mobile): apply Dart 3.47.0 Home bar formatter [formatted]"
          git push
