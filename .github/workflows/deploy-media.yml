name: Deploy Media

# Deploys the media delivery Worker (services/media-worker) and, when asked,
# switches the backend's recording and avatar links to it. Option 1 of
# docs/decisions/media-worker-options.md: the Worker lives in the Cloudflare
# account that owns the R2 bucket (so its R2 binding works) and is served on
# that account's workers.dev subdomain. See services/media-worker/README.md.
#
#   mode = check    verify the media token and account: token active, Workers
#                   Scripts and R2 bucket reachable, bucket in this account,
#                   workers.dev subdomain. Changes nothing.
#   mode = deploy   check, then deploy the Worker, copy the signing secret and
#                   smoke-test it. The backend is not changed.
#   mode = enable   deploy, then set SAVESTREAM_MEDIA_BASE_URL on the VPS,
#                   restart the API services and roll the recorder over with a
#                   drain (running recordings are never cut)
#   mode = disable  rollback: remove SAVESTREAM_MEDIA_BASE_URL, restart the API
#                   services and drain the recorder; links go back to the R2
#                   S3 endpoint. The Worker is left running.
#
# The bucket name (SAVESTREAM_R2_BUCKET) and the signing secret
# (secrets dir/media_signing_secret, created by deploy.sh) are read from the
# VPS over SSH; the secret is masked and only piped to `wrangler secret put`.
#
# Secrets: VPS_* (as Deploy Backend), CLOUDFLARE_MEDIA_ACCOUNT_ID and
# CLOUDFLARE_MEDIA_API_TOKEN (account that owns the R2 bucket; token needs
# Account > Workers Scripts: Edit and Account > Workers R2 Storage: Read).

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "check | deploy | enable | disable"
        type: choice
        options: [check, deploy, enable, disable]
        default: check

concurrency:
  group: deploy-media-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  media:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    env:
      VPS_PORT: ${{ vars.VPS_PORT || '22' }}
      VPS_APP_DIR: ${{ vars.VPS_APP_DIR || '/home/nduythanh/SaveStream' }}
      CF_API: https://api.cloudflare.com/client/v4
      WORKER_NAME: savestream-media
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_MEDIA_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_MEDIA_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/vps.sh <<'EOF'
          ssh -i ~/.ssh/deploy_key -p "$VPS_PORT" -o BatchMode=yes \
            -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" "cd '$VPS_APP_DIR' && $1"
          EOF

      - name: Check the media token and account
        if: inputs.mode != 'disable'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -uo pipefail
          [[ -n "$CLOUDFLARE_ACCOUNT_ID" && -n "$CLOUDFLARE_API_TOKEN" ]] \
            || { echo "::error::CLOUDFLARE_MEDIA_ACCOUNT_ID / CLOUDFLARE_MEDIA_API_TOKEN are not set"; exit 1; }
          # Pasted secrets often carry a newline, spaces or quotes; strip them
          # and say what was wrong without printing either value.
          clean() { printf '%s' "$1" | tr -d '[:space:]"'"'"; }
          account="$(clean "$CLOUDFLARE_ACCOUNT_ID")"
          token="$(clean "$CLOUDFLARE_API_TOKEN")"
          [[ "$account" != "$CLOUDFLARE_ACCOUNT_ID" ]] && echo "note: removed whitespace/quotes from CLOUDFLARE_MEDIA_ACCOUNT_ID"
          [[ "$token" != "$CLOUDFLARE_API_TOKEN" ]] && echo "note: removed whitespace/quotes from CLOUDFLARE_MEDIA_API_TOKEN"
          # Diagnostics (the account ID is not a secret; the token is never printed).
          echo "account id: raw length ${#CLOUDFLARE_ACCOUNT_ID}, cleaned length ${#account}, first 4 '${account:0:4}', last 4 '${account: -4}'"
          printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | grep -q '[[:space:]]' && echo "account id: raw value contains whitespace/newline" || echo "account id: no whitespace/newline"
          bad="$(printf '%s' "$account" | grep -o '[^0-9a-f]' | tr -d '\n' || true)"
          echo "account id: characters that are not lowercase hex: '${bad:-none}'"
          printf '%s' "$CLOUDFLARE_API_TOKEN" | grep -q '[[:space:]]' && echo "token: raw value contains whitespace/newline" || echo "token: no whitespace/newline"
          echo "token: raw length ${#CLOUDFLARE_API_TOKEN}, cleaned length ${#token}, characters outside [A-Za-z0-9_-]: $(printf '%s' "$token" | { grep -o '[^A-Za-z0-9_-]' || true; } | wc -l)"
          # A stray character pasted next to the ID (seen: 33 hex chars): when the
          # secret contains the account that owns the R2 bucket, use that ID.
          r2_account="$(bash ~/vps.sh "sed -n 's/^SAVESTREAM_R2_ENDPOINT=//p' deploy/vps/production.env | tail -n 1" \
            | sed -E 's#^https?://([0-9a-f]{32})\..*#\1#')"
          echo "R2 bucket account (from SAVESTREAM_R2_ENDPOINT): ${r2_account:-unknown}"
          if [[ ! "$account" =~ ^[0-9a-f]{32}$ && "$r2_account" =~ ^[0-9a-f]{32}$ && "$account" == *"$r2_account"* ]]; then
            echo "note: the secret is the R2 account ID with $(( ${#account} - 32 )) extra character(s); using the R2 account ID"
            account="$r2_account"
          fi
          if [[ "$account" =~ ^[0-9a-f]{32}$ ]]; then
            echo "account id format: ok (32 hex)"
          else
            echo "account id format: NOT a 32-character hex Account ID (length ${#account}); copy it from the account's Overview page"
          fi
          echo "token length: ${#token}"
          echo "::add-mask::$account"
          echo "::add-mask::$token"
          export CLOUDFLARE_ACCOUNT_ID="$account" CLOUDFLARE_API_TOKEN="$token"
          {
            echo "CLOUDFLARE_ACCOUNT_ID=$account"
            echo "CLOUDFLARE_API_TOKEN=$token"
          } >> "$GITHUB_ENV"
          cf() { curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$CF_API$1"; }
          ok() { jq -e '.success == true' >/dev/null; }
          failed=0
          report() { if [[ "$2" == ok ]]; then echo "PASS  $1"; else echo "FAIL  $1 — $3"; failed=1; fi; }

          # Account-owned and user-owned tokens verify at different endpoints.
          if cf "/accounts/$CLOUDFLARE_ACCOUNT_ID/tokens/verify" | jq -e '.result.status == "active"' >/dev/null \
            || cf "/user/tokens/verify" | jq -e '.result.status == "active"' >/dev/null; then
            report "token is active" ok
          else
            reason="$(cf "/user/tokens/verify" | jq -r '[.errors[]? | "\(.code) \(.message)"] | join("; ")')"
            report "token is active" no "Cloudflare says: ${reason:-no detail}"
          fi
          echo "verify /user/tokens/verify: $(cf "/user/tokens/verify" | jq -c '{success, status: .result.status, errors: [.errors[]? | "\(.code) \(.message)"]}')"
          echo "verify /accounts/<secret id>/tokens/verify: $(cf "/accounts/$CLOUDFLARE_ACCOUNT_ID/tokens/verify" | jq -c '{success, status: .result.status, errors: [.errors[]? | "\(.code) \(.message)"]}')"
          echo "accounts this token can see:"
          cf "/accounts?per_page=50" | jq -r 'if .success then (.result[]? | "  \(.id)  \(.name)") else "  (none) \([.errors[]? | "\(.code) \(.message)"] | join("; "))" end'

          if cf "/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts" | ok; then
            report "Workers Scripts access" ok
          else
            report "Workers Scripts access" no "add Account > Workers Scripts: Edit for this account"
          fi
          # Read-only tokens get "No access" on per-script endpoints; with Edit a
          # missing script answers "not found" and an existing one succeeds.
          probe="$(cf "/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER_NAME/settings")"
          echo "script settings probe: $(printf '%s' "$probe" | jq -c '{success, errors: [.errors[]? | "\(.code) \(.message)"]}')"
          if printf '%s' "$probe" | jq -e '[.errors[]?.message] | any(test("No access"; "i"))' >/dev/null; then
            report "Workers Scripts: Edit" no "the token can only read Workers scripts; change Account > Workers Scripts from Read to Edit"
          else
            report "Workers Scripts: Edit" ok
          fi

          env_value() { bash ~/vps.sh "sed -n 's/^$1=//p' deploy/vps/production.env | tail -n 1"; }
          bucket="$(env_value SAVESTREAM_R2_BUCKET)"
          endpoint="$(env_value SAVESTREAM_R2_ENDPOINT)"
          # The R2 binding only sees buckets in the Worker's own account;
          # compare without printing either id.
          endpoint_account="$(printf '%s' "$endpoint" | sed -E 's#^https?://([0-9a-f]{32})\..*#\1#')"
          echo "bucket '$bucket' lives in account ${endpoint_account} (from SAVESTREAM_R2_ENDPOINT); secret account starts ${CLOUDFLARE_ACCOUNT_ID:0:4}…${CLOUDFLARE_ACCOUNT_ID: -4}"
          if [[ "$endpoint_account" == "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            report "bucket '$bucket' is in this account" ok
          else
            report "bucket '$bucket' is in this account" no "CLOUDFLARE_MEDIA_ACCOUNT_ID is not the account in SAVESTREAM_R2_ENDPOINT"
          fi
          errs() { jq -c '{success, errors: [.errors[]? | "\(.code) \(.message)"]}'; }
          echo "r2 GET bucket '$bucket': $(cf "/accounts/$CLOUDFLARE_ACCOUNT_ID/r2/buckets/$bucket" | errs)"
          echo "r2 list buckets: $(cf "/accounts/$CLOUDFLARE_ACCOUNT_ID/r2/buckets" | jq -c '{success, errors: [.errors[]? | "\(.code) \(.message)"], names: [.result.buckets[]?.name]}')"
          echo "workers subdomain: $(cf "/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" | jq -c '{success, errors: [.errors[]? | "\(.code) \(.message)"], has_subdomain: ((.result.subdomain // "") != "")}')"
          if cf "/accounts/$CLOUDFLARE_ACCOUNT_ID/r2/buckets/$bucket" | ok; then
            report "R2 bucket readable" ok
          else
            report "R2 bucket readable" no "add Account > Workers R2 Storage: Read for this account"
          fi

          subdomain="$(cf "/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" | jq -r '.result.subdomain // empty')"
          origin=""
          if [[ -n "$subdomain" ]]; then
            report "workers.dev subdomain" ok
            origin="https://$WORKER_NAME.$subdomain.workers.dev"
          else
            # Some tokens cannot read this endpoint; `wrangler deploy` prints
            # the workers.dev URL, which the deploy step picks up instead.
            echo "note: workers.dev subdomain not readable with this token; taking the URL from wrangler deploy"
          fi
          [[ "$failed" == 0 ]] || exit 1
          echo "Media origin: ${origin:-from wrangler deploy}"
          {
            echo "R2_BUCKET=$bucket"
            echo "MEDIA_ORIGIN=$origin"
          } >> "$GITHUB_ENV"

      - name: Read signing secret and sample objects from the VPS
        if: inputs.mode == 'deploy' || inputs.mode == 'enable'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          env_value() { bash ~/vps.sh "sed -n 's/^$1=//p' deploy/vps/production.env | tail -n 1"; }
          secrets_dir="$(env_value SAVESTREAM_SECRETS_DIR)"
          [[ -n "$secrets_dir" ]] || { echo "SAVESTREAM_SECRETS_DIR missing"; exit 1; }
          secret="$(bash ~/vps.sh "cat '$secrets_dir/media_signing_secret' 2>/dev/null || true")"
          [[ ${#secret} -ge 32 ]] || { echo "media_signing_secret missing: run Deploy Backend first"; exit 1; }
          echo "::add-mask::$secret"
          psql() {
            bash ~/vps.sh "docker compose --env-file deploy/vps/production.env -f deploy/vps/docker-compose.production.yml \
              exec -T postgres psql -X -U savestream -d savestream -tA -c \"$1\" < /dev/null"
          }
          artifact_key="$(psql "select storage_key from artifacts where deleted_at is null order by created_at desc limit 1")"
          avatar_key="$(psql "select creator_avatar_key from watches where creator_avatar_key is not null limit 1")"
          {
            echo "MEDIA_SIGNING_SECRET=$secret"
            echo "SAMPLE_ARTIFACT_KEY=$artifact_key"
            echo "SAMPLE_AVATAR_ID=${avatar_key#creator-avatars/}"
          } >> "$GITHUB_ENV"

      - run: npm install --no-audit --no-fund
        if: inputs.mode == 'deploy' || inputs.mode == 'enable'

      - name: Test the Worker
        if: inputs.mode == 'deploy' || inputs.mode == 'enable'
        run: npm --workspace services/media-worker test

      - name: Deploy the Worker
        if: inputs.mode == 'deploy' || inputs.mode == 'enable'
        working-directory: services/media-worker
        run: |
          set -o pipefail
          sed -i "s/__R2_BUCKET__/${R2_BUCKET}/" wrangler.jsonc
          npx wrangler deploy 2>&1 | tee /tmp/wrangler-deploy.log
          url="$(grep -oE "https://$WORKER_NAME\.[a-z0-9-]+\.workers\.dev" /tmp/wrangler-deploy.log | head -n 1 || true)"
          if [[ -z "$MEDIA_ORIGIN" ]]; then
            [[ -n "$url" ]] || { echo "::error::wrangler did not print a workers.dev URL (is a workers.dev subdomain set up?)"; exit 1; }
            echo "MEDIA_ORIGIN=$url" >> "$GITHUB_ENV"
            echo "Media origin (from wrangler): $url"
          fi
          printf '%s' "$MEDIA_SIGNING_SECRET" | npx wrangler secret put MEDIA_SIGNING_SECRET

      - name: Smoke-test the Worker
        if: inputs.mode == 'deploy' || inputs.mode == 'enable'
        run: |
          for _ in $(seq 1 30); do
            [[ "$(curl -s -o /dev/null -w '%{http_code}' "$MEDIA_ORIGIN/healthz")" == 200 ]] && break
            sleep 5
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' "$MEDIA_ORIGIN/healthz")" = 200
          if [[ -n "$SAMPLE_AVATAR_ID" ]]; then
            code="$(curl -s -o /dev/null -w '%{http_code} %{content_type}' "$MEDIA_ORIGIN/a/$SAMPLE_AVATAR_ID")"
            echo "avatar -> $code"; [[ "$code" == "200 image/"* ]]
          fi
          if [[ -n "$SAMPLE_ARTIFACT_KEY" ]]; then
            url="$(python3 - <<'PY'
          import base64, hashlib, hmac, os, time
          from urllib.parse import quote, urlencode
          key = os.environ["SAMPLE_ARTIFACT_KEY"]
          path = "/o/" + quote(key, safe="/")
          expires = int(time.time()) + 300
          mac = hmac.new(os.environ["MEDIA_SIGNING_SECRET"].encode(),
                         f"{path}\n{expires}\n".encode(), hashlib.sha256).digest()
          sig = base64.urlsafe_b64encode(mac).rstrip(b"=").decode()
          print(f"{os.environ['MEDIA_ORIGIN']}{path}?{urlencode({'e': expires, 's': sig})}")
          PY
          )"
            code="$(curl -s -o /dev/null -w '%{http_code} %{content_type}' -H 'Range: bytes=0-1023' "$url")"
            echo "recording range -> $code"; [[ "$code" == "206 video/mp4"* ]]
            code="$(curl -s -o /dev/null -w '%{http_code}' "${url%%&s=*}&s=bad")"
            echo "bad signature -> $code"; [[ "$code" == 403 ]]
            curl -s -o /dev/null -D - -H 'Origin: https://savestream.online' -H 'Range: bytes=0-15' "$url" \
              | grep -qi '^access-control-allow-origin: https://savestream.online' \
              && echo "CORS for savestream.online -> ok"
          fi

      - name: Switch backend links (API restart + recorder drain)
        if: inputs.mode == 'enable' || inputs.mode == 'disable'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          MODE: ${{ inputs.mode }}
        run: |
          if [[ "$MODE" == enable ]]; then line="SAVESTREAM_MEDIA_BASE_URL=$MEDIA_ORIGIN"; else line=""; fi
          # Rewrite the one line in production.env (untracked) and keep a copy
          # for manual rollback. API services restart in place; the recorder is
          # outside `config --services` (profile "recorder") and is rolled over
          # with recorder-rollout.sh, which drains: running recordings finish
          # on the old container.
          bash ~/vps.sh "set -e
            f=deploy/vps/production.env
            cp \"\$f\" \"\$f.before-media-\$(date -u +%Y%m%dT%H%M%SZ)\"
            grep -v '^SAVESTREAM_MEDIA_BASE_URL=' \"\$f\" > \"\$f.tmp\" || true
            [ -n '$line' ] && echo '$line' >> \"\$f.tmp\"
            cat \"\$f.tmp\" > \"\$f\" && rm -f \"\$f.tmp\"
            c='docker compose --env-file deploy/vps/production.env -f deploy/vps/docker-compose.production.yml'
            \$c up -d --no-build \$(\$c config --services)
            for _ in \$(seq 1 60); do
              [ \"\$(docker inspect -f '{{.State.Health.Status}}' \$(\$c ps -q api))\" = healthy ] && break
              sleep 5
            done
            \$c exec -T api python -c 'from app.settings import get_app_settings as s; print(\"media_base_url =\", repr(s().media_base_url))'
            bash deploy/vps/recorder-rollout.sh"

      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key ~/vps.sh
