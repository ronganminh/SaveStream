name: Media Worker CI

on:
  pull_request:
    paths:
      - "services/media-worker/**"
      - ".github/workflows/media-worker-ci.yml"
      - ".github/workflows/deploy-media.yml"
  push:
    branches: [main]
    paths:
      - "services/media-worker/**"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm --workspace services/media-worker test
      - name: Wrangler dry-run build
        working-directory: services/media-worker
        run: |
          sed -i 's/__R2_BUCKET__/ci-bucket/' wrangler.jsonc
          npx wrangler deploy --dry-run --outdir dist
