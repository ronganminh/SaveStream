name: Backend E2E

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-e2e.yml"

jobs:
  staging-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Validate E2E Compose
        working-directory: backend
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml config --quiet

      - name: Start real dependencies and backend workers
        working-directory: backend
        run: |
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml up -d --build             postgres redis minio minio-init mail-debug fake-stream api worker outbox-dispatcher

      - name: Run register-to-delete E2E flow
        working-directory: backend
        run: |
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml run --rm e2e-runner

      - name: Prepare API restart continuity state
        working-directory: backend
        run: |
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml run --rm --no-deps \
            e2e-runner python -m app.e2e.phase12_resilience prepare-api-restart

      - name: Restart API and verify existing session
        working-directory: backend
        run: |
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml restart api
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml run --rm --no-deps \
            e2e-runner python -m app.e2e.phase12_resilience verify-api-restart

      - name: Queue recording while worker is stopped
        working-directory: backend
        run: |
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml stop worker
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml run --rm --no-deps \
            e2e-runner python -m app.e2e.phase12_resilience prepare-worker-restart

      - name: Restart worker and verify queued recovery
        working-directory: backend
        run: |
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml start worker
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml run --rm --no-deps \
            e2e-runner python -m app.e2e.phase12_resilience verify-worker-restart

      - name: Dump E2E service logs on failure
        if: failure()
        working-directory: backend
        run: |
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml ps
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml logs             api worker outbox-dispatcher fake-stream mail-debug minio postgres redis

      - name: Tear down E2E stack
        if: always()
        working-directory: backend
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml down -v --remove-orphans
