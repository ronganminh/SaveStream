name: Production Diagnostics

# Read-only: SSH to the VPS and run deploy/vps/diagnostics.sh (recording
# outcomes and failure reasons, error log lines, cleanup checks). It does not
# pull code, rebuild, restart or write to the database. Uses the same VPS_*
# secrets as Deploy Backend.

on:
  workflow_dispatch:
    inputs:
      days:
        description: "How many days of recordings to summarize"
        default: "7"

concurrency:
  group: production-diagnostics
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    env:
      VPS_PORT: ${{ vars.VPS_PORT || '22' }}
      VPS_APP_DIR: ${{ vars.VPS_APP_DIR || '/home/nduythanh/SaveStream' }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Run diagnostics on VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          DAYS: ${{ inputs.days }}
        run: |
          [[ "$DAYS" =~ ^[0-9]+$ ]] || { echo "days must be a number"; exit 1; }
          # The script is streamed from this checkout, so the VPS working
          # tree is not touched.
          ssh -i ~/.ssh/deploy_key -p "$VPS_PORT" -o BatchMode=yes \
            -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" \
            "cd '$VPS_APP_DIR' && bash -s -- $DAYS" < deploy/vps/diagnostics.sh

      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
