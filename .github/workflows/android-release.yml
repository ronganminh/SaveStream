name: Android release bundle

# Builds a signed release AAB for the owner to upload in Play Console by
# hand (this workflow never publishes anything). Needs these repository
# secrets, added once in GitHub Settings → Secrets and variables → Actions:
#   ANDROID_UPLOAD_KEYSTORE_BASE64  base64 of the Play upload keystore (.jks)
#   ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
#   ANDROID_GOOGLE_SERVICES_JSON    google-services.json of the Firebase app
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build"
        default: main

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Check secrets
        env:
          KEYSTORE: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GOOGLE_SERVICES: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON }}
        run: |
          missing=()
          [[ -n "$KEYSTORE" ]] || missing+=(ANDROID_UPLOAD_KEYSTORE_BASE64)
          [[ -n "$STORE_PASSWORD" ]] || missing+=(ANDROID_KEYSTORE_PASSWORD)
          [[ -n "$KEY_ALIAS" ]] || missing+=(ANDROID_KEY_ALIAS)
          [[ -n "$KEY_PASSWORD" ]] || missing+=(ANDROID_KEY_PASSWORD)
          [[ -n "$GOOGLE_SERVICES" ]] || missing+=(ANDROID_GOOGLE_SERVICES_JSON)
          if (( ${#missing[@]} )); then
            echo "::error::Missing repository secrets: ${missing[*]}"
            exit 1
          fi

      - name: Write signing and Firebase files
        env:
          KEYSTORE: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          GOOGLE_SERVICES: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON }}
        run: |
          printf '%s' "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/upload.jks"
          printf '%s' "$GOOGLE_SERVICES" > android/app/google-services.json
          grep -q '"package_name": *"com.savestream.app"' android/app/google-services.json \
            || { echo "::error::google-services.json is not for com.savestream.app"; exit 1; }

      - name: Build release AAB
        env:
          SAVESTREAM_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          SAVESTREAM_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SAVESTREAM_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SAVESTREAM_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          # AdMob ids (public, not secrets) of the v1 app com.savestream.app;
          # repository variables override them. Sources only hold Google's
          # test ids, which debug builds and CI use.
          SAVESTREAM_ADMOB_ANDROID_APP_ID: ${{ vars.ADMOB_ANDROID_APP_ID || 'ca-app-pub-2078852906622512~2464439785' }}
          ADMOB_REWARDED_ANDROID: ${{ vars.ADMOB_REWARDED_ANDROID || 'ca-app-pub-2078852906622512/5155016450' }}
          ADMOB_BANNER_ANDROID: ${{ vars.ADMOB_BANNER_ANDROID || 'ca-app-pub-2078852906622512/4061426634' }}
        run: |
          flutter pub get --enforce-lockfile
          bash tool/generate_native_assets.sh
          flutter build appbundle --release --dart-define=APP_ENV=production \
            --dart-define=ADMOB_REWARDED_ANDROID="$ADMOB_REWARDED_ANDROID" \
            --dart-define=ADMOB_BANNER_ANDROID="$ADMOB_BANNER_ANDROID"
          ls -l build/app/outputs/bundle/release/

      - name: Verify the bundle is release-signed
        run: |
          jarsigner -verify -certs build/app/outputs/bundle/release/app-release.aab | tail -3
          if jarsigner -verify -verbose -certs build/app/outputs/bundle/release/app-release.aab | grep -q "CN=Android Debug"; then
            echo "::error::Bundle is debug-signed"; exit 1
          fi

      - name: Print upload certificate fingerprints and version
        # Public certificate data only, to compare with the upload key
        # certificate in Play Console (Setup > App signing).
        run: |
          keytool -printcert -jarfile build/app/outputs/bundle/release/app-release.aab \
            | grep -E "Owner:|SHA1:|SHA256:"
          grep -E '^version:' pubspec.yaml
          {
            echo "### Android release bundle"
            echo '```'
            keytool -printcert -jarfile build/app/outputs/bundle/release/app-release.aab \
              | grep -E "Owner:|SHA1:|SHA256:"
            grep -E '^version:' pubspec.yaml
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: savestream-android-aab
          path: apps/mobile/build/app/outputs/bundle/release/app-release.aab
          retention-days: 7

      - name: Remove signing files
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks" android/app/google-services.json
