name: Bootstrap Flutter native runners

on:
  push:
    branches:
      - feat/flutter-mobile
    paths:
      - 'apps/mobile/pubspec.yaml'
      - '.github/workflows/mobile-native-bootstrap.yml'

permissions:
  contents: write

jobs:
  generate-native-runners:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/flutter-mobile
          fetch-depth: 0

      - name: Stop when runners already exist
        id: runners
        shell: bash
        run: |
          if [[ -d apps/mobile/android && -d apps/mobile/ios ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Flutter
        if: steps.runners.outputs.exists == 'false'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Generate clean platform runners
        if: steps.runners.outputs.exists == 'false'
        shell: bash
        run: |
          rm -rf /tmp/savestream_mobile
          flutter create \
            --platforms=android,ios \
            --org com.savestream \
            --project-name savestream_mobile \
            /tmp/savestream_mobile
          cp -R /tmp/savestream_mobile/android apps/mobile/android
          cp -R /tmp/savestream_mobile/ios apps/mobile/ios
          cp /tmp/savestream_mobile/.metadata apps/mobile/.metadata

          # Keep the bundle/application identifier fixed to com.savestream.app.
          activity="$(find apps/mobile/android/app/src/main/kotlin -name MainActivity.kt | head -n 1)"
          mkdir -p apps/mobile/android/app/src/main/kotlin/com/savestream/app
          sed -i 's/^package .*/package com.savestream.app/' "$activity"
          mv "$activity" apps/mobile/android/app/src/main/kotlin/com/savestream/app/MainActivity.kt
          find apps/mobile/android/app/src/main/kotlin -type d -empty -delete

          sed -i 's/com\.savestream\.savestream_mobile/com.savestream.app/g' apps/mobile/android/app/build.gradle.kts
          sed -i 's/android:label="savestream_mobile"/android:label="SaveStream"/' apps/mobile/android/app/src/main/AndroidManifest.xml

          find apps/mobile/ios -type f \
            \( -name '*.pbxproj' -o -name '*.plist' -o -name '*.xcconfig' -o -name '*.swift' -o -name '*.xcscheme' \) \
            -print0 | xargs -0 sed -i \
              -e 's/com\.savestream\.savestreamMobile/com.savestream.app/g' \
              -e 's/com\.savestream\.savestream_mobile/com.savestream.app/g'

          python - <<'PY'
          from pathlib import Path
          import plistlib

          path = Path('apps/mobile/ios/Runner/Info.plist')
          data = plistlib.loads(path.read_bytes())
          data['CFBundleDisplayName'] = 'SaveStream'
          data['CFBundleName'] = 'SaveStream'
          path.write_bytes(plistlib.dumps(data, sort_keys=False))
          PY

      - name: Commit generated runners
        if: steps.runners.outputs.exists == 'false'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile/android apps/mobile/ios apps/mobile/.metadata
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore(mobile): generate Flutter platform runners"
          git push origin HEAD:feat/flutter-mobile
