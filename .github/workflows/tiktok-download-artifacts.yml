name: TikTok public video download artifacts

on:
  push:
    branches:
      - feat/tiktok-video-downloader-backend
    paths:
      - ".github/workflows/tiktok-download-artifacts.yml"
      - "backend/src/app/infrastructure/video_downloads/**"
      - "backend/src/app/application/video_downloads/**"
      - "backend/pyproject.toml"
      - "backend/Dockerfile"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  download-public-videos:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install FFmpeg and browser dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install backend and TikTok providers
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m playwright install --with-deps chromium
      - name: Try providers in fallback order and download the three links
        id: download
        env:
          PYTHONPATH: backend/src
        run: |
          mkdir -p downloads
          python - <<'PY'
          import os
          import shutil
          import tempfile
          from pathlib import Path

          from app.application.video_downloads.urls import normalize_tiktok_url
          from app.infrastructure.video_downloads import worker

          urls = [
              "https://www.tiktok.com/@tramquannsatvutru/video/7696351169647561992?is_from_webapp=1&sender_device=pc",
              "https://www.tiktok.com/@pakesub3/video/7702676085506411809?is_from_webapp=1&sender_device=pc",
              "https://www.tiktok.com/@wuryhochust2026/video/7702885119203216661?is_from_webapp=1&sender_device=pc",
          ]
          providers = [
              ("yt-dlp", worker._download_with_ytdlp),
              ("tiktok-dlpy", worker._download_with_tiktokdl),
              ("TikTokApi", worker._download_with_tiktokapi),
          ]
          output = Path("downloads")
          failed = 0
          manifest = []

          for url in urls:
              video_id = url.split("/video/", 1)[1].split("?", 1)[0]
              succeeded = False
              try:
                  canonical_url = normalize_tiktok_url(url)
              except Exception as exc:
                  manifest.append(f"{video_id}: URL rejected ({type(exc).__name__})")
                  failed += 1
                  continue

              for provider_name, provider in providers:
                  with tempfile.TemporaryDirectory(prefix="savestream-ci-") as temp:
                      temp_dir = Path(temp)
                      try:
                          title = provider(canonical_url, temp_dir)
                          source = worker._validate_output(temp_dir)
                          target = output / f"{video_id}.mp4"
                          shutil.copy2(source, target)
                          manifest.append(
                              f"{video_id}: downloaded by {provider_name}; "
                              f"{target.stat().st_size} bytes; {title}"
                          )
                          succeeded = True
                          break
                      except Exception as exc:
                          manifest.append(
                              f"{video_id}: {provider_name} failed ({type(exc).__name__})"
                          )

              if not succeeded:
                  failed += 1
                  manifest.append(f"{video_id}: all providers failed")

          (output / "manifest.txt").write_text("\n".join(manifest) + "\n", encoding="utf-8")
          print("\n".join(manifest))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as result:
              result.write(f"failed={failed}\n")
          PY
      - name: Upload downloaded videos as GitHub Actions artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tiktok-public-videos
          path: downloads/
          if-no-files-found: warn
          retention-days: 3
      - name: Fail if any video could not be downloaded
        if: always() && steps.download.outputs.failed != '0'
        run: |
          echo "One or more TikTok links could not be downloaded. Check manifest.txt and job logs."
          exit 1
