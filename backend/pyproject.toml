[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "savestream-backend"
version = "0.11.0"
description = "SaveStream modular-monolith backend and reusable recording engine."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { file = "LICENSE" }
dependencies = [
  "aiosqlite==0.20.0",
  "argon2-cffi==25.1.0",
  "alembic==1.20.0",
  "asyncpg==0.30.0",
  "celery==5.6.3",
  "curl-cffi==0.12.0",
  "distro==1.9.0",
  "fastapi==0.115.14",
  "ffmpeg-python==0.2.0",
  "httpx==0.28.1",
  "minio==7.2.20",
  "pycryptodome==3.23.0",
  "PyJWT==2.15.1",
  "qrcode==8.2",
  "Pyrogram==2.0.106",
  "redis==5.2.1",
  "requests==2.32.5",
  "SQLAlchemy==2.0.54",
  "uvicorn==0.34.3",
]

[project.scripts]
savestream-recorder = "main:cli"
savestream-outbox = "app.infrastructure.queue.outbox:main"
savestream-credit-admin = "app.infrastructure.credits.admin:main"
savestream-billing-admin = "app.infrastructure.billing.admin:main"

[project.optional-dependencies]
dev = ["mypy==1.18.2", "pytest==9.0.2", "ruff==0.9.10"]

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = ["main", "check_updates", "config"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["adapters*", "app*", "core*", "engine*", "http_utils*", "upload*", "utils*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
ignore_missing_imports = true
disable_error_code = ["import-untyped"]
check_untyped_defs = true
warn_unused_ignores = true
show_error_codes = true
