[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "savestream-backend"
version = "0.0.1"
description = "SaveStream backend migration baseline built around the existing TikTok recorder CLI."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { file = "LICENSE" }
dependencies = [
  "curl-cffi==0.12.0",
  "distro==1.9.0",
  "ffmpeg-python==0.2.0",
  "Pyrogram==2.0.106",
  "requests==2.32.5",
]

[project.scripts]
savestream-recorder = "main:cli"

[project.optional-dependencies]
dev = ["mypy==1.18.2", "pytest==9.0.2", "ruff==0.9.10"]

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = ["main", "check_updates", "config"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["adapters*", "core*", "engine*", "http_utils*", "upload*", "utils*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
ignore_missing_imports = true
disable_error_code = ["import-untyped"]
check_untyped_defs = true
warn_unused_ignores = true
show_error_codes = true
