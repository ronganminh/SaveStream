<html lang="en">

      .bar {

        border-radius: 5px;
        background: rgba(255, 255, 255, 0.28);

      .bar::before {
        content: "";
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 58%;
        border-radius: 5px;
        background: #fff;
      }
      .dl {
        position: absolute;
        right: 64px;
        top: 420px;
        width: 116px;
        height: 116px;
        border-radius: 30px;
        background: #fff;
        box-shadow: 0 24px 50px -20px rgba(21, 18, 43, 0.35);

        place-items: center;
      }
      .dl svg {
        width: 58px;
        height: 58px;
      }
