name: savestream_mobile
description: SaveStream mobile client.
publish_to: "none"
version: 2.0.0+7

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  connectivity_plus: ^7.2.0
  device_info_plus: ^13.3.0
  dio: ^5.11.1
  flutter_riverpod: 3.4.3
  flutter_secure_storage: ^11.2.0
  go_router: 18.0.2
  google_mobile_ads: ^9.1.0
  in_app_purchase: ^3.3.1
  intl: ^0.20.3
  package_info_plus: ^10.2.2
  path_provider: ^2.1.6
  permission_handler: ^12.0.3
  share_plus: ^13.3.1
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2
  video_player: ^2.14.1
  wakelock_plus: ^1.8.1
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0

dev_dependencies:
  crypto: ^3.0.6
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6
  flutter_test:
    sdk: flutter

flutter_launcher_icons:
  android: true
  ios: true
  image_path: build/branding/savestream_app_icon.png
  min_sdk_android: 24
  remove_alpha_ios: true

flutter_native_splash:
  color: "#4F46E5"
  image: build/branding/savestream_app_icon.png
  android: true
  ios: true
  android_12:
    color: "#4F46E5"
    image: build/branding/savestream_app_icon.png

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/branding/
  fonts:
    - family: Geist
      fonts:
        - asset: assets/fonts/Geist-Variable.ttf
    - family: Geist Mono
      fonts:
        - asset: assets/fonts/GeistMono-Variable.ttf
