name: savestream_mobile
description: SaveStream mobile client.
publish_to: "none"
version: 2.0.1+9

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  connectivity_plus: ^7.2.0
  device_info_plus: ^13.3.0
  dio: ^5.11.1
  flutter_riverpod: 3.4.3
  flutter_secure_storage: ^11.2.0
  go_router: 18.0.2
  in_app_purchase: ^3.3.1
  intl: ^0.20.3
  package_info_plus: ^10.2.2
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2
  video_player: ^2.14.1
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  google_sign_in: ^7.2.0
  firebase_messaging: ^16.7.0

dev_dependencies:
  crypto: ^3.0.6
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter_launcher_icons:
  android: true
  ios: true
  image_path: build/branding/savestream_app_icon.png
  min_sdk_android: 24
  remove_alpha_ios: true

flutter_native_splash:
  color: "#4F46E5"
  image: build/branding/savestream_app_icon.png
  android: true
  ios: true
  android_12:
    color: "#4F46E5"
    image: build/branding/savestream_app_icon.png

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/branding/
    - assets/fonts/PlusJakartaSans-OFL.txt
    - assets/fonts/OFL.txt
  fonts:
    # Plus Jakarta Sans static instances (400-800) of the OFL-1.1 variable
    # font from google/fonts; license in assets/fonts/PlusJakartaSans-OFL.txt.
    - family: Plus Jakarta Sans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
    - family: Geist Mono
      fonts:
        - asset: assets/fonts/GeistMono-Variable.ttf
