name: savestream_mobile
description: SaveStream mobile client.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: 3.4.3
  flutter_secure_storage: ^11.2.0
  go_router: 18.0.2
  dio: ^5.11.1
  intl: ^0.20.3
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2

dev_dependencies:
  crypto: ^3.0.6
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6
  flutter_test:
    sdk: flutter

flutter_launcher_icons:
  android: true
  ios: true
  image_path: ios/Runner/Assets.xcassets/AppIcon.appiconset/AppIcon.png
  min_sdk_android: 23
  remove_alpha_ios: true

flutter_native_splash:
  color: "#4F46E5"
  image: ios/Runner/Assets.xcassets/AppIcon.appiconset/AppIcon.png
  android: true
  ios: true
  android_12:
    color: "#4F46E5"
    image: ios/Runner/Assets.xcassets/AppIcon.appiconset/AppIcon.png

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/branding/
