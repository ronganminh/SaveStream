name: savestream-production

x-app-env: &app-env
  SAVESTREAM_ENVIRONMENT: production
  SAVESTREAM_LOG_FORMAT: json
  SAVESTREAM_LOG_LEVEL: INFO

  SAVESTREAM_DATABASE_URL_FILE: /run/secrets/database_url
  SAVESTREAM_REDIS_URL_FILE: /run/secrets/redis_url
  SAVESTREAM_CELERY_BROKER_URL_FILE: /run/secrets/celery_broker_url
  SAVESTREAM_CELERY_RESULT_BACKEND_FILE: /run/secrets/celery_result_backend

  SAVESTREAM_MINIO_ENDPOINT: ${SAVESTREAM_R2_ENDPOINT:?set production R2/S3 endpoint}
  SAVESTREAM_MINIO_ACCESS_KEY_FILE: /run/secrets/r2_access_key
  SAVESTREAM_MINIO_SECRET_KEY_FILE: /run/secrets/r2_secret_key
  SAVESTREAM_MINIO_BUCKET: ${SAVESTREAM_R2_BUCKET:?set production recording bucket}
  SAVESTREAM_MINIO_SECURE: "true"

  SAVESTREAM_JWT_SECRET_FILE: /run/secrets/jwt_secret
  # Verified Firebase project ID is required for Google/Apple auth.
  # Empty keeps social login disabled until the consoles are configured.
  SAVESTREAM_FIREBASE_AUTH_PROJECT_ID: ${SAVESTREAM_FIREBASE_AUTH_PROJECT_ID:-}
  SAVESTREAM_FRONTEND_BASE_URL: ${SAVESTREAM_FRONTEND_ORIGIN:-https://savestream.online}
  # Stable URLs for cached creator avatars (/v1/public/creator-avatars/...).
  SAVESTREAM_PUBLIC_API_BASE_URL: ${SAVESTREAM_PUBLIC_API_ORIGIN:-https://api.savestream.online}
  # Media delivery Worker (services/media-worker, media.savestream.online).
  # Empty keeps links on the R2 S3 endpoint; the Deploy Media workflow sets it
  # in production.env once the Worker is live. The signing secret is created by
  # deploy.sh and copied to the Worker by that workflow.
  SAVESTREAM_MEDIA_BASE_URL: ${SAVESTREAM_MEDIA_BASE_URL:-}
  SAVESTREAM_MEDIA_SIGNING_SECRET_FILE: /run/secrets/media_signing_secret
  SAVESTREAM_CORS_ALLOW_ORIGINS: ${SAVESTREAM_CORS_ALLOW_ORIGINS:-https://savestream.online,https://www.savestream.online}
  # PostHog product analytics, US Cloud (funnel events sent by the server:
  # first_recording_started/ready, purchase_completed). The project token is
  # public and write-only; set SAVESTREAM_POSTHOG_API_KEY= (empty) in
  # production.env to turn server events off.
  SAVESTREAM_POSTHOG_API_KEY: ${SAVESTREAM_POSTHOG_API_KEY-phc_kgs6M7zNgvUZgkVxHfiAEVyaW2JdheSw5LQuPGHTMhuo}
  SAVESTREAM_POSTHOG_HOST: ${SAVESTREAM_POSTHOG_HOST:-https://us.i.posthog.com}

  SAVESTREAM_SMTP_HOST: smtp-relay.brevo.com
  SAVESTREAM_SMTP_PORT: "587"
  SAVESTREAM_SMTP_USERNAME_FILE: /run/secrets/smtp_username
  SAVESTREAM_SMTP_PASSWORD_FILE: /run/secrets/smtp_password
  SAVESTREAM_SMTP_STARTTLS: "true"
  SAVESTREAM_EMAIL_FROM: SaveStream <no-reply@savestream.online>

  SAVESTREAM_PUSH_PROVIDER: ${SAVESTREAM_PUSH_PROVIDER:-noop}
  SAVESTREAM_PUSH_FCM_SERVICE_ACCOUNT_JSON_FILE: /run/secrets/push_fcm_service_account_json

  # Android launches first. `google_play` enables Play purchases without
  # requiring unused App Store credentials; keep `disabled` until the service
  # account has been granted access in Play Console.
  SAVESTREAM_STORE_PURCHASE_PROVIDER: ${SAVESTREAM_STORE_PURCHASE_PROVIDER:-disabled}
  SAVESTREAM_GOOGLE_PLAY_PACKAGE_NAME: ${SAVESTREAM_GOOGLE_PLAY_PACKAGE_NAME:-com.savestream.app}
  SAVESTREAM_GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_FILE: /run/secrets/google_play_service_account_json
  SAVESTREAM_GOOGLE_PLAY_RTDN_AUDIENCE: ${SAVESTREAM_GOOGLE_PLAY_RTDN_AUDIENCE:-https://api.savestream.online/v1/webhooks/google-play}
  SAVESTREAM_GOOGLE_PLAY_RTDN_SERVICE_ACCOUNT_EMAIL: ${SAVESTREAM_GOOGLE_PLAY_RTDN_SERVICE_ACCOUNT_EMAIL:-}

  # AdMob SSV uses Google's public verification keys, so no shared secret is
  # stored in the deployment.
  SAVESTREAM_REWARD_PROVIDER: ${SAVESTREAM_REWARD_PROVIDER:-admob}
  SAVESTREAM_ADMOB_SSV_KEYS_URL: https://www.gstatic.com/admob/reward/verifier-keys.json
  # Rewarded ad units accepted by SSV (not secret): the existing Android
  # rewarded unit from v1 (same app com.savestream.app). Empty turns rewarded
  # ads off (REWARDED_ADS_UNAVAILABLE).
  SAVESTREAM_ADMOB_REWARD_AD_UNITS: ${SAVESTREAM_ADMOB_REWARD_AD_UNITS-ca-app-pub-2078852906622512/5155016450}

  # Channel ownership on the website: false lets a channel added with the
  # ownership confirmation ("I own this channel or have the creator's
  # permission") record on the web without the TikTok bio code. The Android
  # app always requires the bio code and never sees such web-only channels.
  # Owner-approved 2026-11-06 together with the Terms/AUP update (#261).
  SAVESTREAM_WEB_REQUIRE_OWNERSHIP: ${SAVESTREAM_WEB_REQUIRE_OWNERSHIP:-false}

  # "Download my videos" (owner downloads): the API signs 60-second grants the
  # downloader container verifies. Same flag as the downloader service.
  SAVESTREAM_VIDEO_DOWNLOADER_ENABLED: ${SAVESTREAM_VIDEO_DOWNLOADER_ENABLED:-true}
  SAVESTREAM_VIDEO_DOWNLOADER_GRANT_SECRET_FILE: /run/secrets/video_downloader_grant_secret

  # Web checkout supports PayPal Business. Keep disabled until LIVE credentials
  # are installed and the release payment smoke has passed.
  SAVESTREAM_PAYMENT_PROVIDER: ${SAVESTREAM_PAYMENT_PROVIDER:-disabled}
  SAVESTREAM_PAYMENT_PROVIDER_BASE_URL: ${SAVESTREAM_PAYMENT_PROVIDER_BASE_URL:-https://api-m.paypal.com}
  SAVESTREAM_PAYMENT_PROVIDER_API_KEY_FILE: /run/secrets/payment_api_key
  SAVESTREAM_PAYMENT_WEBHOOK_SECRET_FILE: /run/secrets/payment_webhook_secret
  SAVESTREAM_PAYPAL_CLIENT_ID: ${SAVESTREAM_PAYPAL_CLIENT_ID:-}
  # Reuse the protected payment_api_key secret file for the PayPal client secret.
  SAVESTREAM_PAYPAL_CLIENT_SECRET_FILE: /run/secrets/payment_api_key
  SAVESTREAM_LEMON_SQUEEZY_STORE_ID: ${SAVESTREAM_LEMON_SQUEEZY_STORE_ID:-}
  SAVESTREAM_LEMON_SQUEEZY_VARIANT_ID: ${SAVESTREAM_LEMON_SQUEEZY_VARIANT_ID:-}

  SAVESTREAM_METRICS_TOKEN_FILE: /run/secrets/metrics_token
  SAVESTREAM_OPS_ALERT_EMAIL: ${SAVESTREAM_OPS_ALERT_EMAIL:?set operations alert email}
  SAVESTREAM_OPS_ALERT_CHECK_SECONDS: "60"
  SAVESTREAM_OPS_ALERT_COOLDOWN_SECONDS: "1800"

  SAVESTREAM_TRUSTED_PROXY_CIDRS: ${SAVESTREAM_TRUSTED_PROXY_CIDRS:?set trusted proxy CIDRs}
  SAVESTREAM_FORCE_HTTPS: "true"
  SAVESTREAM_SECURITY_HEADERS_ENABLED: "true"
  SAVESTREAM_API_RATE_LIMIT: "300"
  SAVESTREAM_API_RATE_WINDOW_SECONDS: "60"

  SAVESTREAM_QUOTA_MAX_WATCHES_PER_USER: "20"
  SAVESTREAM_QUOTA_MAX_RECORDINGS_PER_DAY: "100"
  SAVESTREAM_QUOTA_MAX_ACTIVE_RECORDINGS_PER_USER: "2"
  SAVESTREAM_WATCH_MAX_CONCURRENT_RECORDINGS_PER_USER: "2"
  # Check offline creators every ~20s so LIVE transitions are visible promptly.
  SAVESTREAM_WATCH_OFFLINE_CHECK_SECONDS: "20"

  SAVESTREAM_RECORDING_SOURCE_BACKEND: tiktok
  # Recordings run on the dedicated recorder-blue/green services (see below).
  SAVESTREAM_RECORDING_QUEUE: recordings
  # Finished recordings are deleted after 30 days for accounts that bought
  # credits and after 7 days for trial-only accounts.
  SAVESTREAM_RECORDING_RETENTION_DAYS: "30"
  SAVESTREAM_RECORDING_RETENTION_DAYS_FREE: "7"
  # Free trial: credits granted once on first email verification (1 credit = 1 minute).
  SAVESTREAM_SIGNUP_CREDITS: "10"
  SAVESTREAM_ACCOUNT_DELETION_GRACE_DAYS: "0"

x-app-secrets: &app-secrets
  - database_url
  - redis_url
  - celery_broker_url
  - celery_result_backend
  - r2_access_key
  - r2_secret_key
  - jwt_secret
  - media_signing_secret
  - smtp_username
  - smtp_password
  - payment_api_key
  - payment_webhook_secret
  - metrics_token
  - push_fcm_service_account_json
  - google_play_service_account_json
  - video_downloader_grant_secret

services:
  api:
    build:
      context: ../../backend
    restart: unless-stopped
    command:
      - sh
      - -c
      - alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment: *app-env
    secrets: *app-secrets
    ports:
      - "127.0.0.1:${SAVESTREAM_API_BIND_PORT:-18001}:8000"
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-fsS",
          "-H",
          "X-Forwarded-Proto: https",
          "http://localhost:8000/health/live",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ../../backend
    restart: unless-stopped
    command:
      - celery
      - -A
      - app.infrastructure.queue.celery_app:celery_app
      - worker
      - --loglevel=INFO
      - --queues=celery
      - --concurrency=2
    environment: *app-env
    secrets: *app-secrets
    networks:
      - backend
    # Background services wait for the API, whose healthcheck only passes after
    # `alembic upgrade head`, so they never query a schema that does not exist yet.
    depends_on:
      api:
        condition: service_healthy

  # Run only recordings, as two interchangeable "colors" so a deploy never cuts a
  # recording: deploy/vps/recorder-rollout.sh starts the idle color on the new
  # image, then tells the running one to finish its recordings and exit (Celery
  # warm shutdown; it stops taking new jobs at once). Both are in the
  # `recorder` profile, so a plain `docker compose up -d` never touches them;
  # use the rollout script. Concurrency is the cap per color; while one color
  # drains, both may be recording.
  recorder-blue: &recorder
    build:
      context: ../../backend
    profiles: ["recorder"]
    restart: unless-stopped
    command:
      - celery
      - -A
      - app.infrastructure.queue.celery_app:celery_app
      - worker
      - --loglevel=INFO
      - --queues=recordings
      - --concurrency=${SAVESTREAM_RECORDING_CONCURRENCY:-6}
      - --hostname=recorder-blue@%h
    environment: *app-env
    secrets: *app-secrets
    networks:
      - backend
    depends_on:
      api:
        condition: service_healthy

  recorder-green:
    <<: *recorder
    command:
      - celery
      - -A
      - app.infrastructure.queue.celery_app:celery_app
      - worker
      - --loglevel=INFO
      - --queues=recordings
      - --concurrency=${SAVESTREAM_RECORDING_CONCURRENCY:-6}
      - --hostname=recorder-green@%h

  scheduler:
    build:
      context: ../../backend
    restart: unless-stopped
    command:
      - celery
      - -A
      - app.infrastructure.queue.celery_app:celery_app
      - beat
      - --loglevel=INFO
    environment: *app-env
    secrets: *app-secrets
    networks:
      - backend
    depends_on:
      api:
        condition: service_healthy

  outbox-dispatcher:
    build:
      context: ../../backend
    restart: unless-stopped
    command: ["python", "-m", "app.infrastructure.queue.outbox"]
    environment: *app-env
    secrets: *app-secrets
    networks:
      - backend
    depends_on:
      api:
        condition: service_healthy

  # Public TikTok video downloader (web "Free tools"). Its own container with
  # hard CPU/RAM limits and only the secrets it needs (no database, storage,
  # JWT or mail credentials). Off unless SAVESTREAM_VIDEO_DOWNLOADER_ENABLED is
  # true AND a proxy URL gives it its own outbound IP: without one it refuses
  # to enable, so it never shares the IP LIVE recording uses. Files stream
  # straight through; nothing is stored. nginx routes only
  # /v1/public/video-downloader/ here (see nginx-production.conf.example).
  downloader:
    build:
      context: ../../backend
    restart: unless-stopped
    command:
      - uvicorn
      - app.downloader.app:app
      - --host=0.0.0.0
      - --port=8000
      - --workers=1
      - --no-server-header
    environment:
      SAVESTREAM_ENVIRONMENT: production
      SAVESTREAM_LOG_FORMAT: json
      SAVESTREAM_LOG_LEVEL: INFO
      SAVESTREAM_REDIS_URL_FILE: /run/secrets/redis_url
      SAVESTREAM_TRUSTED_PROXY_CIDRS: ${SAVESTREAM_TRUSTED_PROXY_CIDRS:?set trusted proxy CIDRs}
      SAVESTREAM_CORS_ALLOW_ORIGINS: ${SAVESTREAM_CORS_ALLOW_ORIGINS:-https://savestream.online,https://www.savestream.online}
      SAVESTREAM_FRONTEND_BASE_URL: ${SAVESTREAM_FRONTEND_ORIGIN:-https://savestream.online}
      SAVESTREAM_VIDEO_DOWNLOADER_ENABLED: ${SAVESTREAM_VIDEO_DOWNLOADER_ENABLED:-true}
      SAVESTREAM_VIDEO_DOWNLOADER_PROXY_URL_FILE: /run/secrets/video_downloader_proxy_url
      SAVESTREAM_VIDEO_DOWNLOADER_GRANT_SECRET_FILE: /run/secrets/video_downloader_grant_secret
      SAVESTREAM_TURNSTILE_SECRET_KEY: ${SAVESTREAM_TURNSTILE_SECRET_KEY:-}
    secrets:
      - redis_url
      - video_downloader_proxy_url
      - video_downloader_grant_secret
    ports:
      - "127.0.0.1:${SAVESTREAM_DOWNLOADER_BIND_PORT:-18011}:8000"
    cpus: "0.5"
    mem_limit: 512m
    pids_limit: 256
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop:
      - ALL
    # Read the mounted secret files (mode 600, owned by the deploy user)
    # without giving back any other capability.
    cap_add:
      - DAC_READ_SEARCH
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health/live"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - backend
    depends_on:
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: savestream
      POSTGRES_USER: savestream
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U savestream -d savestream"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - backend

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command:
      - sh
      - -c
      - exec redis-server --appendonly yes --requirepass "$$(cat /run/secrets/redis_password)"
    secrets:
      - redis_password
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli -a "$$(cat /run/secrets/redis_password)" ping 2>/dev/null | grep -q PONG
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - backend

networks:
  backend: {}

volumes:
  postgres_data: {}
  redis_data: {}

secrets:
  postgres_password:
    file: ${SAVESTREAM_SECRETS_DIR:?set production secrets dir}/postgres_password
  database_url:
    file: ${SAVESTREAM_SECRETS_DIR:?set production secrets dir}/database_url
  redis_password:
    file: ${SAVESTREAM_SECRETS_DIR:?set production secrets dir}/redis_password
  redis_url:
    file: ${SAVESTREAM_SECRETS_DIR:?set production secrets dir}/redis_url
  celery_broker_url:
    file: ${SAVESTREAM_SECRETS_DIR:?set production secrets dir}/celery_broker_url
  celery_result_backend:
    file: ${SAVESTREAM_SECRETS_DIR:?set production secrets dir}/celery_result_backend
  r2_access_key:
    file: ${SAVESTREAM_SECRETS_DIR:?set production secrets dir}/r2_access_key
  r2_secret_key:
    file: ${SAVESTREAM_SECRETS_DIR:?set production secrets dir}/r2_secret_key
  jwt_secret:
    file: ${SAVESTREAM_SECRETS_DIR:?set production secrets dir}/jwt_secret
  media_signing_secret:
    file: ${SAVESTREAM_SECRETS_DIR:?set production secrets dir}/media_signing_secret
  smtp_username:
    file: ${SAVESTREAM_SECRETS_DIR:?set production secrets dir}/smtp_username
  smtp_password:
    file: ${SAVESTREAM_SECRETS_DIR:?set production secrets dir}/smtp_password
  payment_api_key:
    file: ${SAVESTREAM_SECRETS_DIR:?set production secrets dir}/payment_api_key
  payment_webhook_secret:
    file: ${SAVESTREAM_SECRETS_DIR:?set production secrets dir}/payment_webhook_secret
  metrics_token:
    file: ${SAVESTREAM_SECRETS_DIR:?set production secrets dir}/metrics_token
  push_fcm_service_account_json:
    file: ${SAVESTREAM_SECRETS_DIR:?set production secrets dir}/push_fcm_service_account_json
  google_play_service_account_json:
    file: ${SAVESTREAM_SECRETS_DIR:?set production secrets dir}/google_play_service_account_json
  # Video downloader: created by deploy.sh if missing. The proxy URL file stays
  # empty until the owner adds the downloader's egress proxy.
  video_downloader_proxy_url:
    file: ${SAVESTREAM_SECRETS_DIR:?set production secrets dir}/video_downloader_proxy_url
  video_downloader_grant_secret:
    file: ${SAVESTREAM_SECRETS_DIR:?set production secrets dir}/video_downloader_grant_secret
