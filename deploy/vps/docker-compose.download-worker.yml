services:
  download-worker:
    build:
      context: ../../backend
      dockerfile: Dockerfile.downloader
    restart: unless-stopped
    init: true
    command:
      - celery
      - -A
      - app.infrastructure.queue.celery_app:celery_app
      - worker
      - --loglevel=INFO
      - --queues=downloads
      - --concurrency=1
      - --without-gossip
      - --without-mingle
      - --hostname=download@%h
    environment:
      # This worker imports only the queue and storage settings. It does not
      # receive the production DB, JWT, payment, SMTP, FCM, or Google Play keys.
      SAVESTREAM_ENVIRONMENT: staging
      SAVESTREAM_CELERY_BROKER_URL_FILE: /run/secrets/celery_broker_url
      SAVESTREAM_CELERY_RESULT_BACKEND_FILE: /run/secrets/celery_result_backend
      SAVESTREAM_MINIO_ENDPOINT: ${SAVESTREAM_R2_ENDPOINT:?set R2 endpoint}
      SAVESTREAM_MINIO_ACCESS_KEY_FILE: /run/secrets/download_r2_access_key
      SAVESTREAM_MINIO_SECRET_KEY_FILE: /run/secrets/download_r2_secret_key
      SAVESTREAM_MINIO_BUCKET: ${SAVESTREAM_DOWNLOAD_R2_BUCKET:?set dedicated download bucket}
      SAVESTREAM_MINIO_SECURE: "true"
      SAVESTREAM_ARTIFACT_PRESIGN_SECONDS: "900"
    secrets:
      - celery_broker_url
      - celery_result_backend
      - download_r2_access_key
      - download_r2_secret_key
    cpus: 1.5
    mem_limit: 2g
    pids_limit: 128
    shm_size: 512m
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=768m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

secrets:
  celery_broker_url:
    file: ${SAVESTREAM_SECRETS_DIR:?set downloader secrets dir}/celery_broker_url
  celery_result_backend:
    file: ${SAVESTREAM_SECRETS_DIR:?set downloader secrets dir}/celery_result_backend
  download_r2_access_key:
    file: ${SAVESTREAM_SECRETS_DIR:?set downloader secrets dir}/download_r2_access_key
  download_r2_secret_key:
    file: ${SAVESTREAM_SECRETS_DIR:?set downloader secrets dir}/download_r2_secret_key
