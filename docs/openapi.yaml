          "RATE_LIMITED",
          "IDEMPOTENCY_KEY_REUSED",
          "STREAM_OFFLINE",
          "STREAM_UNAVAILABLE",
          "RECORDING_ALREADY_ACTIVE",
          "RECORDING_NOT_STOPPABLE",
          "INSUFFICIENT_CREDITS",
          "PAYMENT_PENDING",
          "PAYMENT_FAILED",
          "SERVICE_UNAVAILABLE",
