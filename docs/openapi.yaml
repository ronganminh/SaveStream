  "components": {
    "securitySchemes": {
      "bearerAuth": {
        "type": "http",
        "scheme": "bearer",
        "bearerFormat": "JWT"
      }
    },
    "parameters": {
      "IdempotencyKey": {
        "name": "Idempotency-Key",
        "in": "header",
        "required": true,
        "description": "Client-generated UUID. Same key + different body returns 409 IDEMPOTENCY_KEY_REUSED.",
        "schema": {
          "type": "string",
          "format": "uuid"
        }
      },
      "Cursor": {
        "name": "cursor",
        "in": "query",
        "required": false,
        "schema": {
          "type": "string"
        }
      },
      "Limit": {
        "name": "limit",
        "in": "query",
        "required": false,
        "schema": {
          "type": "integer",
          "minimum": 1,
          "maximum": 100,
          "default": 20
        }
      },
      "LastEventId": {
        "name": "Last-Event-ID",
        "in": "header",
        "required": false,
        "schema": {
          "type": "string"
        }
      }
    },
    "schemas": {
      "OpaqueId": {
        "type": "string",
        "description": "Opaque server-generated identifier. Clients MUST NOT parse it; UUID or ULID may be used internally."
      },
      "UtcDateTime": {
        "type": "string",
        "format": "date-time",
        "description": "UTC ISO-8601 timestamp."
      },
      "Source": {
        "type": "object",
        "required": [
          "type",
          "value"
        ],
        "properties": {
          "type": {
            "type": "string",
            "enum": [
              "username",
              "room_id",
              "url"
            ]
          },
          "value": {
            "type": "string",
            "minLength": 1
          }
        },
        "additionalProperties": false
      },
      "Creator": {
        "type": "object",
        "required": [
          "platform",
          "username",
          "display_name",
          "avatar_url"
        ],
        "properties": {
          "platform": {
            "type": "string",
            "enum": [
              "tiktok"
            ]
          },
          "username": {
            "type": "string"
          },
          "display_name": {
            "type": "string"
          },
          "avatar_url": {
            "type": [
              "string",
              "null"
            ],
            "format": "uri"
          }
        },
        "additionalProperties": false
      },
      "Pagination": {
        "type": "object",
        "required": [
          "next_cursor",
          "has_more"
        ],
        "properties": {
          "next_cursor": {
            "type": [
              "string",
              "null"
            ]
          },
          "has_more": {
            "type": "boolean"
          }
        },
        "additionalProperties": false
      },
      "ErrorCode": {
        "type": "string",
        "enum": [
          "AUTH_INVALID_CREDENTIALS",
          "AUTH_EMAIL_NOT_VERIFIED",
          "AUTH_SESSION_REVOKED",
          "FORBIDDEN",
          "RESOURCE_NOT_FOUND",
          "VALIDATION_ERROR",
          "RATE_LIMITED",
          "IDEMPOTENCY_KEY_REUSED",
          "STREAM_OFFLINE",
          "STREAM_UNAVAILABLE",
          "RECORDING_ALREADY_ACTIVE",
          "RECORDING_NOT_STOPPABLE",
          "INSUFFICIENT_CREDITS",
          "PAYMENT_PENDING",
          "PAYMENT_FAILED",
          "SERVICE_UNAVAILABLE",
          "INTERNAL_ERROR"
        ]
      },
      "ApiError": {
        "type": "object",
        "required": [
          "code",
          "message",
          "request_id",
          "retryable",
          "details"
        ],
        "properties": {
          "code": {
            "$ref": "#/components/schemas/ErrorCode"
          },
          "message": {
            "type": "string"
          },
          "request_id": {
            "type": "string"
          },
          "retryable": {
            "type": "boolean"
          },
          "details": {
            "type": "object",
            "additionalProperties": true
          }
        },
        "additionalProperties": false
      },
      "ErrorEnvelope": {
        "type": "object",
        "required": [
          "error"
        ],
        "properties": {
          "error": {
            "$ref": "#/components/schemas/ApiError"
          }
        },
        "additionalProperties": false
      },
      "User": {
        "type": "object",
        "required": [
          "id",
          "email",
          "email_verified",
          "display_name",
          "locale",
          "created_at"
        ],
        "properties": {
          "id": {
            "$ref": "#/components/schemas/OpaqueId"
          },
          "email": {
            "type": "string",
            "format": "email"
          },
          "email_verified": {
            "type": "boolean"
          },
          "display_name": {
            "type": [
              "string",
              "null"
            ]
          },
          "locale": {
            "type": "string"
          },
          "created_at": {
            "$ref": "#/components/schemas/UtcDateTime"
          }
        },
        "additionalProperties": false
      },
      "RegisterRequest": {
        "type": "object",
        "required": [
          "email",
          "password"
        ],
        "properties": {
          "email": {
            "type": "string",
            "format": "email"
          },
          "password": {
            "type": "string",
            "minLength": 8
          },
          "display_name": {
            "type": [
              "string",
              "null"
            ]
          }
        },
        "additionalProperties": false
      },
      "AuthMessage": {
        "type": "object",
        "required": [
          "message"
        ],
        "properties": {
          "message": {
            "type": "string"
          }
        },
        "additionalProperties": false
      },
      "VerifyEmailRequest": {
        "type": "object",
        "required": [
          "token"
        ],
        "properties": {
          "token": {
            "type": "string"
          }
        },
        "additionalProperties": false
      },
      "EmailRequest": {
        "type": "object",
        "required": [
          "email"
        ],
        "properties": {
          "email": {
            "type": "string",
            "format": "email"
          }
        },
        "additionalProperties": false
      },
      "LoginRequest": {
        "type": "object",
        "required": [
          "email",
          "password",
          "client_type"
        ],
        "properties": {
          "email": {
            "type": "string",
            "format": "email"
          },
          "password": {
            "type": "string"
          },
          "client_type": {
            "type": "string",
            "enum": [
              "web",
              "mobile"
            ]
          }
        },
        "additionalProperties": false
      },
      "TokenResponse": {
        "type": "object",
        "required": [
          "access_token",
          "token_type",
          "expires_in",
          "refresh_token"
        ],
        "properties": {
          "access_token": {
            "type": "string"
          },
          "token_type": {
            "type": "string",
            "enum": [
              "Bearer"
            ]
          },
          "expires_in": {
            "type": "integer",
            "minimum": 1
          },
          "refresh_token": {
            "type": [
              "string",
              "null"
            ],
            "description": "Mobile only. Web receives refresh credential as HttpOnly cookie."
          }
        },
        "additionalProperties": false
      },
      "RefreshRequest": {
        "type": "object",
        "properties": {
          "refresh_token": {
            "type": [
              "string",
              "null"
            ],
            "description": "Mobile token; omit for web cookie transport."
          }
        },
        "additionalProperties": false
      },
      "ResetPasswordRequest": {
        "type": "object",
        "required": [
          "token",
          "password"
        ],
        "properties": {
          "token": {
            "type": "string"
          },
          "password": {
            "type": "string",
            "minLength": 8
          }
        },
        "additionalProperties": false
      },
      "UpdateMeRequest": {
        "type": "object",
        "properties": {
          "display_name": {
            "type": [
              "string",
              "null"
            ]
          },
          "locale": {
            "type": "string"
          }
        },
        "additionalProperties": false
      },
      "Session": {
        "type": "object",
        "required": [
          "id",
          "created_at",
          "last_seen_at",
          "current"
        ],
        "properties": {
          "id": {
            "$ref": "#/components/schemas/OpaqueId"
          },
          "created_at": {
            "$ref": "#/components/schemas/UtcDateTime"
          },
          "last_seen_at": {
            "$ref": "#/components/schemas/UtcDateTime"
          },
          "current": {
            "type": "boolean"
          },
          "user_agent": {
            "type": [
              "string",
              "null"
            ]
          },
          "ip_hint": {
            "type": [
              "string",
              "null"
            ]
          }
        },
        "additionalProperties": false
      },
      "SessionsResponse": {
        "type": "object",
        "required": [
          "items"
        ],
        "properties": {
          "items": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/Session"
            }
          }
        },
        "additionalProperties": false
      },
      "LiveStatusRequest": {
        "type": "object",
        "required": [
          "source"
        ],
        "properties": {
          "source": {
            "$ref": "#/components/schemas/Source"
          }
        },
        "additionalProperties": false
      },
      "LiveStatusResponse": {
        "type": "object",
        "required": [
          "source",
          "creator",
          "live_status",
          "room_id",
          "checked_at"
        ],
        "properties": {
          "source": {
            "$ref": "#/components/schemas/Source"
          },
          "creator": {
            "oneOf": [
              {
                "$ref": "#/components/schemas/Creator"
              },
              {
                "type": "null"
              }
            ]
          },
          "live_status": {
            "type": "string",
            "enum": [
              "unknown",
              "offline",
              "live"
            ]
          },
          "room_id": {
            "type": [
              "string",
              "null"
            ]
          },
          "checked_at": {
            "$ref": "#/components/schemas/UtcDateTime"
          }
        },
        "additionalProperties": false
      },
      "RecordingStatus": {
        "type": "string",
        "enum": [
          "queued",
          "resolving",
          "waiting_live",
          "recording",
          "processing",
          "uploading",
          "completed",
