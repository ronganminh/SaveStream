            "application/json": {
              "schema": {
                "type": "object",
                "additionalProperties": true
              }
            }
          }
        },
        "responses": {
          "204": {
            "description": "Notification accepted"
          },
          "422": {
            "description": "Invalid or unsupported signed notification",
